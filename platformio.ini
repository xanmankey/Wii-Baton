[env:GameController]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit LSM9DS1 Library@^2.2.1
	lemmingdev/ESP32-BLE-Gamepad@^0.7.4
	h2zero/NimBLE-Arduino@^2.2.3
