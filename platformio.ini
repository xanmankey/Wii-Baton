	martinbudden/SensorFusion@^0.1.3
	martinbudden/IMU_TYPES@^0.2.2
	adafruit/Adafruit Sensor Lab@^0.8.2
	/home/xanmankey/Programming/Hardware/GameController/Arduino_LSM9DS1-master.zip
	reefwing-software/ReefwingAHRS@^2.3.6
	reefwing-software/Reefwing_imuTypes@^2.0.3
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/SdFat - Adafruit Fork@^2.3.54
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit SPIFlash@^5.1.1
